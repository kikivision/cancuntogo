<!DOCTYPE html>
<!--
  Paste-ready EMAIL HEADER (works in Gmail, Apple Mail, Outlook).
  Email clients don't run JS or render inline SVG, so the mark is a hosted
  PNG and everything is table + inline styles + web-safe fonts.

  Copy the <table> below into your email tool's HTML block.

  ── Per-brand values (swap these three things) ────────────────────────────
    CancunToGo : mark = https://cancuntogo.com/marketing/marks/cancuntogo-sunset.png
                 wordmark "Cancún" + accent "ToGo" #90D7EC · bar #EE8A5A
    Sky & Swim : mark = https://skyandswim.com/marketing/marks/skyandswim-teal.png
                 wordmark "Sky " + accent "&" #C0392B + " Swim" · bar #2E6B79
    Jet & Swim : (add once its logo PNG + colours are set)
  Host the PNG anywhere public (your site, S3, Cloudinary) and point src at it.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;background:#0E2A32;">
  <tr>
    <td align="left" style="padding:22px 26px;font-family:Georgia,'Times New Roman',serif;">
      <img src="https://cancuntogo.com/marketing/marks/cancuntogo-sunset.png" width="46" height="46" alt="CancunToGo" style="vertical-align:middle;border:0;display:inline-block;">
      <span style="font-size:26px;font-weight:bold;color:#ffffff;vertical-align:middle;margin-left:12px;">Cancún<span style="color:#90D7EC;">ToGo</span></span>
    </td>
  </tr>
  <tr>
    <td style="height:5px;line-height:5px;font-size:0;background:#EE8A5A;">&nbsp;</td>
  </tr>
</table>
